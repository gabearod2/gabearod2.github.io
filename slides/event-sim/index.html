<script>
  Reveal.initialize({
    width:1918, height:1080, margin:0, minScale:0.05, maxScale:4,
    center:false, controls:true, progress:true, slideNumber:'c/t', hash:true,
    transition:'none', backgroundTransition:'none', viewDistance:2, mobileViewDistance:1,
    autoPlayMedia:null
  });
  // Safari/slow-load fallback: make sure videos on the current slide are playing
  function kick(e) {
    document.querySelectorAll('.reveal .slides section.present video').forEach(function(v) {
      if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
    });
  }
  Reveal.on('slidechanged', function(e) { setTimeout(kick, 150); setTimeout(kick, 1500); });
  Reveal.on('ready', function(e) { setTimeout(kick, 150); });
</script>
